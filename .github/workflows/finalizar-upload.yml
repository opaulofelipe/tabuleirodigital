name: Finalizar upload do tabuleiro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar os cinco arquivos finais
        shell: bash
        run: |
          echo '' | base64 -d | python3
      - name: Publicar atualização
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza tabuleiro digital para 64 casas"
          git push
