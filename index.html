<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <title>Tabuleiro Digital</title>
  <link rel="stylesheet" href="styles.css?v=20260917-2040" />
</head>
<body>
  <main class="app-shell">
    <div class="game-layout">
      <div class="board-zone">
        <section class="board-frame" aria-label="Tabuleiro digital">
          <div id="stage" class="stage" role="application" aria-label="Tabuleiro interativo 1920 por 1080">
            <img
              class="board-image"
              src="tabuleiromaior.png"
              alt=""
              draggable="false"
              aria-hidden="true"
            />

            <svg
              id="roadsLayer"
              class="roads-layer"
              viewBox="0 0 1920 1080"
              preserveAspectRatio="none"
              aria-label="Estradas do tabuleiro"
            ></svg>

            <div id="numbersLayer" class="numbers-layer" aria-label="Números sorteados da partida"></div>
            <div id="pointsLayer" class="points-layer" aria-label="Locais de construção"></div>
          </div>
        </section>
      </div>

      <aside class="control-rail" aria-label="Controles da partida">
        <div class="rail-actions">
          <button
            id="undoButton"
            class="rail-action"
            type="button"
            aria-label="Desfazer"
            title="Desfazer"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4v5M4.6 11a8 8 0 1 0 2.3-5.7L4 8"/></svg>
          </button>

          <button
            id="newGameButton"
            class="rail-action"
            type="button"
            aria-label="Nova partida"
            title="Nova partida"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/></svg>
          </button>

          <button
            id="fullscreenButton"
            class="rail-action"
            type="button"
            aria-label="Entrar em tela cheia"
            title="Tela cheia"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          </button>
        </div>

        <div class="rail-center">
          <div
            id="colorPicker"
            class="color-picker"
            role="radiogroup"
            aria-label="Escolher cor do jogador"
          ></div>

          <div class="dice-control" aria-label="Rolador de dois dados">
            <div class="dice-pair" aria-live="polite">
              <span id="die1" class="mini-die" role="img" aria-label="Dado 1 mostrando 1"></span>
              <span id="die2" class="mini-die" role="img" aria-label="Dado 2 mostrando 1"></span>
            </div>

            <button
              id="rollDiceButton"
              class="dice-roll-button"
              type="button"
              aria-label="Rolar dois dados"
              title="Rolar dois dados"
            >
              Rolar
            </button>

            <span
              id="diceTotal"
              class="dice-total"
              aria-live="polite"
              aria-label="Total dos dados"
              title="Total"
            >2</span>
          </div>
        </div>

        <div class="rail-balance" aria-hidden="true"></div>
      </aside>
    </div>
  </main>

  <div id="contextMenu" class="context-menu" role="menu" aria-hidden="true" hidden>
    <div class="menu-eyebrow" id="menuEyebrow">Construção</div>
    <div class="menu-title" id="menuTitle">Escolha uma opção</div>
    <div id="menuItems" class="menu-items"></div>
  </div>

  <div id="dialogBackdrop" class="dialog-backdrop" hidden>
    <section
      id="newGameDialog"
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogTitle"
      aria-describedby="dialogDescription"
    >
      <div class="dialog-icon" aria-hidden="true">↻</div>
      <h2 id="dialogTitle">Iniciar nova partida?</h2>
      <p id="dialogDescription">
        As construções e estradas atuais serão removidas e os 64 números serão sorteados novamente.
      </p>
      <div class="dialog-actions">
        <button id="cancelNewGame" class="dialog-button secondary" type="button">Cancelar</button>
        <button id="confirmNewGame" class="dialog-button primary" type="button">Nova partida</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js?v=20260918-2353"></script>
</body>
</html>
